services:
  db:
    image: postgres:17
    # These only create the database on first start, when the volume is empty.
    # Changing them later does nothing until the volume is removed.
    environment:
      POSTGRES_DB: cashew
      POSTGRES_USER: cashew
      POSTGRES_PASSWORD: cashew
    ports:
      # Exposed so Django can reach it from the host while it still runs
      # outside Docker. Once the api service exists this is only for psql.
      - "5432:5432"
    volumes:
      # Without this the database lives inside the container and the first
      # `docker compose down` takes it with it.
      - cashew_pgdata:/var/lib/postgresql/data
    healthcheck:
      # Postgres opens its port before it is ready to answer. Something has to
      # ask it, or whatever depends on it starts too early and falls over.
      test: ["CMD-SHELL", "pg_isready -U cashew -d cashew"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      # The repo root, not api/: pyproject.toml and uv.lock live up here, and a
      # build cannot reach outside its context.
      context: .
      dockerfile: api/Dockerfile
    env_file:
      # SECRET_KEY and DEBUG come from the same file the local server uses.
      - api/.env
    environment:
      # Overrides the DATABASE_URL in that file. Inside the compose network the
      # database answers to its service name; localhost here would mean this
      # container, which has no database in it.
      DATABASE_URL: postgres://cashew:cashew@db:5432/cashew
      # The container is reached through the published port, so it has to
      # recognise the name the browser asks for.
      ALLOWED_HOSTS: localhost,127.0.0.1
    ports:
      - "8000:8000"
    depends_on:
      db:
        # Waits for the healthcheck rather than for the container to exist.
        # Postgres accepts connections a moment after it starts listening, and
        # migrations run the instant this container boots.
        condition: service_healthy

volumes:
  cashew_pgdata:
